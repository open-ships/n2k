name: Scheduled reliability

on:
  schedule:
    - cron: 23 4 * * 0
  workflow_dispatch:
    inputs:
      soak_duration:
        description: Software soak duration (maximum 24h; job limit is 90m)
        default: 1h
        required: true
      fuzz_duration:
        description: Fuzz duration per harness (each has a 15m hard timeout)
        default: 2m
        required: true

permissions:
  contents: read

concurrency:
  group: scheduled-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      fetch-depth: 0
      setup-just: true
      lint: true
      security: true
      gosec-excludes: G115
      artifact-name: scheduled-software-conformance
      artifact-path: conformance-artifacts/local-*
      command: |
        go test ./...
        just pgn-sync-check
        just format-check
        just release-check
        just conformance-local

  soak:
    needs: verify
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      setup-just: true
      timeout-minutes: 90
      environment: |-
        {"SOAK_DURATION":${{ toJSON(inputs.soak_duration || '1h') }}}
      artifact-name: scheduled-software-soak
      artifact-path: conformance-artifacts/soak-*
      command: |
        just reliability-soak "$SOAK_DURATION" 80m

  fuzz:
    needs: verify
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      setup-just: true
      timeout-minutes: 80
      environment: |-
        {"FUZZ_DURATION":${{ toJSON(inputs.fuzz_duration || '2m') }}}
      failure-artifact-name: scheduled-fuzz-failure-corpus
      failure-artifact-path: |
        internal/**/testdata/fuzz/**
        pgn/testdata/fuzz/**
      command: |
        just test-race
        just fuzz-long "$FUZZ_DURATION"
