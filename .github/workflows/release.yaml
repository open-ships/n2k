name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    uses: open-ships/ci/.github/workflows/release-go.yaml@57a20d38b43f01b49d02b82cae004e57f49edaa2 # v1.0.0
    with:
      commit-sha: ${{ github.event.workflow_run.head_sha }}
      project-name: n2k
      distribution: source
      go-version: 1.26.5
