name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      runner: ${{ matrix.os }}
      setup-just: true
      artifact-name: software-conformance
      artifact-path: conformance-artifacts/local-*
      command: |
        if [ "$RUNNER_OS" = Linux ]; then
          just pgn-sync-check
          just conformance-local
        fi
        go test ./...
      artifact-enabled: ${{ matrix.os == 'ubuntu-latest' }}

  race-and-fuzz:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      setup-just: true
      artifact-name: software-reliability-smoke
      artifact-path: conformance-artifacts/soak-*
      failure-artifact-name: fuzz-failure-corpus
      failure-artifact-path: |
        internal/**/testdata/fuzz/**
        pgn/testdata/fuzz/**
      command: |
        just test-race
        just fuzz-smoke
        just reliability-soak 10s 2m

  lint:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      lint: true

  secure:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      security: true
      gosec-excludes: G115

  release-metadata:
    uses: open-ships/ci/.github/workflows/check-go.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      fetch-depth: 0
      setup-just: true
      command: |
        just format-check
        just release-check

  release-gate:
    if: ${{ always() }}
    needs: [test, race-and-fuzz, lint, secure, release-metadata]
    uses: open-ships/ci/.github/workflows/gate.yaml@95d4b3ed5452a99525c240688de146553e57cee0 # shared CI v1.2.0 candidate
    with:
      results: ${{ toJSON(needs) }}
