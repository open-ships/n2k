name: Test

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          check-latest: true

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: PGN sync check
        run: just pgn-sync-check

      - name: Test
        run: go test ./...
