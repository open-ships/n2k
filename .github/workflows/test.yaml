name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          check-latest: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: PGN sync check
        if: runner.os == 'Linux'
        run: just pgn-sync-check

      - name: Local conformance evidence
        if: runner.os == 'Linux'
        run: just conformance-local

      - name: Test
        run: go test ./...

  race-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          check-latest: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Race detector
        run: just test-race

      - name: Fuzz smoke tests
        run: just fuzz-smoke

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

  secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          check-latest: true

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: go1.26.6
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Run gosec
        env:
          GOTOOLCHAIN: go1.26.6
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude-generated -exclude-dir=.claude -exclude=G115 ./...

  release-gate:
    if: ${{ always() }}
    needs: [test, race-and-fuzz, lint, secure]
    runs-on: ubuntu-latest
    env:
      TEST_RESULT: ${{ needs.test.result }}
      RACE_FUZZ_RESULT: ${{ needs.race-and-fuzz.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      SECURE_RESULT: ${{ needs.secure.result }}

    steps:
      - name: Require every release gate
        run: |
          test "$TEST_RESULT" = success
          test "$RACE_FUZZ_RESULT" = success
          test "$LINT_RESULT" = success
          test "$SECURE_RESULT" = success
